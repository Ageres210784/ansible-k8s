---
- name: Check if cluster already initialised
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: _kubelet_conf

- name: Start master
  when: not _kubelet_conf.stat.exists
  block:
    - name: Ensure directory /etc/kubernetes
      ansible.builtin.file:
        path: /etc/kubernetes
        state: directory
        mode: '0700'

    - name: Ensure kubeadm-config.yaml
      ansible.builtin.template:
        src: kubeadm-config.j2
        dest: /etc/kubernetes/kubeadm-config.yaml
        mode: '0600'

    - name: Download images k8s
      ansible.builtin.command: kubeadm config images pull

    - name: Initialisation master
      # If use eBPF you need to add `--skip-phases=addon/kube-proxy`
      ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml

    - name: Add directory for config file
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: '0700'
    - name: Add link for config file
      ansible.builtin.file:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        state: link

    - name: Install calico
      when: k8s_cni == 'calico'
      block:
        - name: Check namespace tigera-operator
          ansible.builtin.command: kubectl get ns tigera-operator
          register: _tigera_operator_out
          ignore_errors: true

        - name: Install tigera-operator
          when: _tigera_operator_out.rc == 1
          ansible.builtin.command: >
            kubectl create -f
            https://raw.githubusercontent.com/projectcalico/calico/{{ k8s_tigera_operator_version }}/manifests/{{ item }}
          with_items:
            - v1_crd_projectcalico_org.yaml
            - tigera-operator.yaml

        - name: Wait for ready CRD tigera-operator
          ansible.builtin.command: kubectl wait --for=condition=Established crd installations.operator.tigera.io apiservers.operator.tigera.io --timeout=120s
          changed_when: false
          retries: 10
          delay: 5
          register: _crd_wait
          until: _crd_wait.rc == 0

        - name: Ensure calico-install.yaml
          ansible.builtin.template:
            src: calico-install.j2
            dest: /etc/kubernetes/calico-install.yaml
            mode: '0600'

        - name: Install Calico
          ansible.builtin.command: kubectl apply -f /etc/kubernetes/calico-install.yaml

    - name: Wait for coredns starts
      ansible.builtin.command: "kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}'"
      changed_when: false
      check_mode: false
      register: _dns_ip
      until: _dns_ip.rc == 0
      retries: 10
      delay: 30
    - name: Show var _dns_ip
      ansible.builtin.debug:
        var: _dns_ip

    - name: Get coredns ip
      ansible.builtin.set_fact:
        _coredns_ip: "{{ _dns_ip.stdout }}"

    - name: Ensure nodelocaldns-daemonset.yaml
      ansible.builtin.template:
        src: nodelocaldns-daemonset.j2
        dest: /etc/kubernetes/nodelocaldns-daemonset.yaml
        mode: '0600'

    - name: Install nodelocaldns
      ansible.builtin.command: kubectl apply -f /etc/kubernetes/nodelocaldns-daemonset.yaml

    - name: Ensure kubelet service
      ansible.builtin.service:
        name: kubelet
        state: started
        enabled: true
