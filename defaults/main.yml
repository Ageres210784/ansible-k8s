---
k8s_version: "1.36.3"
k8s_packages:
  - net-tools
  - gpg
  - iproute2
  - iptables
  - vim
  - bash-completion
  - nfs-common
  - tar
  - chrony
  - jq
  # - ipvsadm
  - python3-yaml
  - apt-transport-https
  - ca-certificates
  - python3-docker
  - gnupg
  - containerd
  - "cri-tools={{ k8s_version.split('.')[:2] | join('.') }}.*"
  - "kubectl={{ k8s_version }}-*"
  - "kubelet={{ k8s_version }}-*"
  - "kubeadm={{ k8s_version }}-*"
k8s_add_docker_repo: true
k8s_cri_socket: "unix:///run/containerd/containerd.sock"

k8s_modules:
  - br_netfilter
  - overlay
  - nf_conntrack

k8s_sandbox_image: ""
# Example
# k8s_sandbox_image: "registry.k8s.io/pause:3.10"

# The second priority controlPlaneEndpoint
k8s_ha_cluster_virtual_ip: ""
# Example
# k8s_ha_cluster_virtual_ip: 192.168.1.100
k8s_ha_cluster_virtual_port: 7443

# kubernetes configure
k8s_domain_name: cluster.local
k8s_api_version: kubeadm.k8s.io/v1beta4
k8s_image_repository: registry.k8s.io
k8s_service_cidr: "10.233.0.0/18"
k8s_pod_network_cidr: "10.233.64.0/18"
k8s_nodelocaldns_local_ip: "169.254.25.10"
k8s_system_reserved: true
k8s_system_memory_reserved: 512Mi
k8s_system_cpu_reserved: 500m
k8s_container_log_max_size: 1Mi
k8s_container_log_max_files: 3
# The first priority controlPlaneEndpoint
k8s_control_plane_endpoint: ""
# Example
# k8s_control_plane_endpoint: "192.168.1.100:6443"
k8s_taints:
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule
# For run pods in control_plain nodes
# k8s_taints: []

# Only calico now
k8s_cni: calico
k8s_tigera_operator_version: v3.32.2
k8s_encapsulation: "IPIPCrossSubnet"

k8s_nodelocaldns_image: "registry.k8s.io/dns/k8s-dns-node-cache:1.26.8"
